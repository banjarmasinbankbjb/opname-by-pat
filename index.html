                    keluar: 0,
                    fisik: initialStock,
                    condition: 'Baik',
                    note: 'Otomatis'
                };
            }

            const rec = periodLedger[period][barangId];
            const saldoSistem = rec.awal + rec.masuk - rec.keluar;
            const selisih = rec.fisik - saldoSistem;
            const item = masterBarang.find(b => b.id === barangId);
            const harga = item ? item.harga : 0;
            const nilaiPersediaan = rec.fisik * harga;

            return {
                ...rec,
                saldoSistem,
                selisih,
                harga,
                nilaiPersediaan
            };
        }

        function getPreviousPeriod(period) {
            const parts = period.split('-');
            let year = parseInt(parts[0]);
            let month = parseInt(parts[1]);
            month--;
            if (month < 1) {
                month = 12;
                year--;
            }
            const mStr = month < 10 ? '0' + month : month;
            return `${year}-${mStr}`;
        }

        function getNextPeriod(period) {
            const parts = period.split('-');
            let year = parseInt(parts[0]);
            let month = parseInt(parts[1]);
            month++;
            if (month > 12) {
                month = 1;
                year++;
            }
            const mStr = month < 10 ? '0' + month : month;
            return `${year}-${mStr}`;
        }

                            <p class="text-[11px] font-semibold text-indigo-700">Sedang Diproses</p>
                            <p class="text-xl font-bold text-indigo-800 mt-1">${reqStats.processing}</p>

            // Render Low Stock Items inside Widget

            masterBarang.forEach(b => {
                const stat = getItemPeriodStat(b.id, activePeriod);

                    lowItems.push({ ...b, currentFisik: stat.fisik });
                }
            });

                lowStockContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Semua stok berada di atas batas minimum.</p>`;

                            </span>
                        </div>
                    </div>
                `).join('');
            }

            // Init Chart.js
            setTimeout(() => {
                const ctx = document.getElementById('stockMovementChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: masterBarang.slice(0, 6).map(b => b.nama.substring(0, 15) + '...'),
                            datasets: [
                                {
                                    label: 'Saldo Awal',
                                    data: masterBarang.slice(0, 6).map(b => getItemPeriodStat(b.id, activePeriod).awal),
                                    backgroundColor: '#94a3b8',
                                    borderRadius: 6
                                },
                                {
                                    label: 'Barang Masuk',
                                    data: masterBarang.slice(0, 6).map(b => getItemPeriodStat(b.id, activePeriod).masuk),
                                    backgroundColor: '#3b82f6',
                                    borderRadius: 6
                                },
                                {
                                    label: 'Barang Keluar',
                                    data: masterBarang.slice(0, 6).map(b => getItemPeriodStat(b.id, activePeriod).keluar),
                                    backgroundColor: '#f59e0b',
                                    borderRadius: 6
                                },
                                {
                                    label: 'Stok Fisik Opname',
                                    data: masterBarang.slice(0, 6).map(b => getItemPeriodStat(b.id, activePeriod).fisik),
                                    backgroundColor: '#10b981',
                                    borderRadius: 6
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'top', labels: { font: { size: 11, family: 'Inter' } } }
                            },
                            scales: {
                                y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }, 50);
        }

        // ==========================================
        // VIEW 2: KATALOG & FORM PERMINTAAN (KARYAWAN)
        // ==========================================

        let cartItems = []; // Multi-item request cart

        function renderKatalogView(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Katalog Persediaan Barang</h2>
                        <p class="text-xs text-slate-500">Pilih barang yang dibutuhkan untuk mengajukan form permintaan persediaan kantor</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="openCartModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md flex items-center">
                            <i class="fa-solid fa-cart-shopping mr-2"></i> Keranjang Permintaan
                            <span id="cartBadgeCount" class="ml-2 bg-white text-blue-600 px-2 py-0.5 rounded-full text-[10px] font-extrabold">${cartItems.length}</span>
                        </button>
                    </div>
                </div>

                <!-- Filter & Search Bar -->
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="relative w-full sm:w-80">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                        <input type="text" id="katalogSearchInput" onkeyup="filterKatalogGrid()" placeholder="Cari nama barang / kode..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <select id="katalogKatFilter" onchange="filterKatalogGrid()" class="w-full sm:w-auto px-3 py-2 border border-slate-200 rounded-xl text-xs text-slate-600 bg-white">
                            <option value="">Semua Kategori</option>
                            <option value="ATK">ATK</option>
                            <option value="IT & Ops">IT & Ops</option>
                            <option value="Kebersihan">Kebersihan</option>
                        </select>
                    </div>
                </div>

                <!-- KATALOG ITEMS GRID -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="katalogGrid">
                    <!-- Dynamic rendering -->
                </div>
            `;

            renderKatalogGridItems();
        }

        function renderKatalogGridItems() {
            const grid = document.getElementById('katalogGrid');
            const search = (document.getElementById('katalogSearchInput')?.value || '').toLowerCase();
            const kat = document.getElementById('katalogKatFilter')?.value || '';

            const filtered = masterBarang.filter(b => {
                const matchName = b.nama.toLowerCase().includes(search) || b.kode.toLowerCase().includes(search);
                const matchKat = kat === '' || b.kategori === kat;
                return matchName && matchKat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">Tidak ada barang persediaan yang cocok.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(b => {
                const stat = getItemPeriodStat(b.id, activePeriod);
                const isOutOfStock = stat.fisik <= 0;
                const inCart = cartItems.find(c => c.barangId === b.id);

                return `
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 flex flex-col justify-between hover:shadow-md transition-all">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">${b.kategori}</span>
                                <span class="text-[10px] text-slate-400 font-mono">${b.kode}</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-800 line-clamp-2">${b.nama}</h3>
                            <p class="text-xs text-slate-400 mt-1">Lokasi: ${b.lokasi}</p>
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase font-semibold">Tersedia</p>
                                <p class="text-sm font-bold ${isOutOfStock ? 'text-red-500' : 'text-emerald-600'}">${stat.fisik} ${b.satuan}</p>
                            </div>
                            <button onclick="addToCart('${b.id}')" ${isOutOfStock ? 'disabled' : ''} class="px-3 py-1.5 ${inCart ? 'bg-emerald-600 text-white' : 'bg-slate-900 hover:bg-blue-600 text-white'} rounded-xl text-xs font-semibold transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center">
                                <i class="fa-solid ${inCart ? 'fa-check' : 'fa-plus'} mr-1.5"></i> ${inCart ? 'Ditambah' : 'Minta'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterKatalogGrid() {
            renderKatalogGridItems();
        }

        function addToCart(barangId) {
            const item = masterBarang.find(b => b.id === barangId);
            const stat = getItemPeriodStat(barangId, activePeriod);
            
            if (stat.fisik <= 0) {
                showToast('Stok barang ini sedang habis!', 'error');
                return;
            }

            const existing = cartItems.find(c => c.barangId === barangId);
            if (!existing) {
                cartItems.push({
                    barangId: barangId,
                    nama: item.nama,
                    satuan: item.satuan,
                    maxStok: stat.fisik,
                    qtyRequested: 1
                });
                showToast(`"${item.nama}" dimasukkan ke keranjang permintaan`, 'success');
            } else {
                showToast(`Barang sudah ada dalam keranjang`, 'info');
            }

            renderKatalogGridItems();
            const badge = document.getElementById('cartBadgeCount');
            if (badge) badge.innerText = cartItems.length;
        }

        function openCartModal() {
            if (cartItems.length === 0) {
                showToast('Keranjang permintaan masih kosong. Silahkan pilih barang lebih dahulu.', 'error');
                return;
            }

            const itemsHtml = cartItems.map((c, index) => `
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div class="flex-1 pr-3">
                        <h4 class="font-semibold text-xs text-slate-800">${c.nama}</h4>
                        <p class="text-[10px] text-slate-400">Tersedia: ${c.maxStok} ${c.satuan}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="number" min="1" max="${c.maxStok}" value="${c.qtyRequested}" onchange="updateCartQty(${index}, this.value)" class="w-16 px-2 py-1 text-xs border border-slate-300 rounded-lg text-center focus:outline-none">
                        <span class="text-xs text-slate-500 font-medium">${c.satuan}</span>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            showModal(`
                <div class="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl border border-slate-100">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-lg text-slate-800 flex items-center">
                            <i class="fa-solid fa-paper-plane text-blue-600 mr-2"></i> Form Permintaan Barang Office
                        </h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <!-- User Auto-filled Readonly Meta -->
                    <div class="grid grid-cols-2 gap-3 bg-blue-50/60 p-3 rounded-xl border border-blue-100 text-xs">
                        <div>
                            <span class="text-slate-400 block text-[10px]">Pemohon:</span>
                            <span class="font-semibold text-slate-800">${currentUser.name}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">NIP / ID:</span>
                            <span class="font-semibold text-slate-800">${currentUser.nip}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">Unit Kerja / Bagian:</span>
                            <span class="font-semibold text-slate-800">${currentUser.unit}</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">Tanggal Permintaan:</span>
                            <span class="font-semibold text-slate-800">${new Date().toLocaleDateString('id-ID')}</span>
                        </div>
                    </div>

                    <!-- Item List in Cart -->
                    <div class="space-y-2 max-h-48 overflow-y-auto">
                        <label class="text-xs font-semibold text-slate-700">Daftar Barang Dipesan:</label>
                        ${itemsHtml}
                    </div>

                    <!-- Form Input details -->
                    <div class="space-y-3 pt-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-700 block mb-1">Keperluan Penggunaan *</label>
                            <input type="text" id="reqKeperluanInput" placeholder="Contoh: Cetak Dokumen Rapat Koordinasi Tahunan" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-700 block mb-1">Catatan Tambahan</label>
                            <textarea id="reqCatatanInput" placeholder="Keterangan opsional..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                        <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold">Batal</button>
                        <button onclick="submitRequisition()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-500/30">KIRIM PERMINTAAN</button>
                    </div>
                </div>
            `);
        }

        function updateCartQty(index, qty) {
            const val = parseInt(qty) || 1;
            if (val > cartItems[index].maxStok) {
                showToast(`Stok maksimal tersedia hanya ${cartItems[index].maxStok}`, 'error');
                cartItems[index].qtyRequested = cartItems[index].maxStok;
            } else {
                cartItems[index].qtyRequested = val;
            }
        }

        function removeFromCart(index) {
            cartItems.splice(index, 1);
            if (cartItems.length === 0) {
                closeModal();
                renderKatalogGridItems();
            } else {
                openCartModal();
            }
        }

        function submitRequisition() {
            const keperluan = document.getElementById('reqKeperluanInput').value;
            const catatan = document.getElementById('reqCatatanInput').value;

            if (!keperluan) {
                showToast('Mohon isi keperluan penggunaan!', 'error');
                return;
            }

            const newReq = {
                id: `REQ-${new Date().getFullYear()}-${String(requisitions.length + 1).padStart(3, '0')}`,
                period: activePeriod,
                tanggal: new Date().toISOString().replace('T', ' ').substring(0, 16),
                karyawanNama: currentUser.name,
                nip: currentUser.nip,
                unit: currentUser.unit,
                keperluan: keperluan,
                catatan: catatan,
                status: 'Menunggu Persetujuan',
                tglPengambilan: '-',
                petugasHandover: '-',
                items: cartItems.map(c => ({
                    barangId: c.barangId,
                    nama: c.nama,
                    satuan: c.satuan,
                    qtyRequested: c.qtyRequested,
                    qtyHanded: c.qtyRequested
                }))
            };

            requisitions.unshift(newReq);
            cartItems = [];

            // Add notification for admin
            notifications.unshift({
                id: Date.now(),
                title: 'Permintaan Baru',
                text: `${newReq.karyawanNama} mengajukan permintaan baru (${newReq.id})`,
                time: 'Baru saja',
                read: false
            });

            closeModal();
            updateNotifications();
            showToast('Permintaan berhasil dikirim ke Supervisor & Admin!', 'success');
            switchTab('myRequests');
        }

        // VIEW 3: PERMINTAAN SAYA (KARYAWAN)
        // ==========================================

                                myReqs.map(r => `

                                        <td class="p-3.5 font-bold font-mono text-blue-600">${r.id}</td>

            `);

        function executeStockHandover(reqId) {
            const req = requisitions.find(r => r.id === reqId);
            if (!req) return;

            const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 16);

            // 1. Process handed quantities and deduct stock automatically
            req.items.forEach((item, idx) => {
                const inputEl = document.getElementById(`actualHandedQty_${idx}`);
                const actualQty = parseInt(inputEl.value) || 0;
                item.qtyHanded = actualQty;

                // DEDUCT FROM PERIOD LEDGER STOK
                const stat = getItemPeriodStat(item.barangId, activePeriod);
                stat.keluar += actualQty;
                stat.fisik = Math.max(0, stat.awal + stat.masuk - stat.keluar); // Recalculate

                // Record into Outgoing Transactions Table Log
                transactionsOut.unshift({
                    id: `TR-OUT-${Date.now().toString().slice(-5)}`,
                    period: activePeriod,
                    tanggal: nowStr.substring(0, 10),
                    barangId: item.barangId,
                    jumlah: actualQty,
                    unit: req.unit,
                    penerima: req.karyawanNama,
                    keperluan: `${req.keperluan} (${req.id})`
                });
            });

            // Update status
            req.status = 'Sudah Diserahkan';
            req.tglPengambilan = nowStr;
            req.petugasHandover = currentUser.name;

            closeModal();
            showToast(`Barang telah diserahkan dan saldo persediaan BERHASIL DIPOTONG otomatis!`, 'success');
            renderPermintaanAdminView(document.getElementById('viewContainer'));
        }

            const satuan = document.getElementById('mSatuan').value || 'pcs';
            const harga = parseFloat(document.getElementById('mHarga').value) || 0;
            const minStok = parseInt(document.getElementById('mMinStok').value) || 5;
            const lokasi = document.getElementById('mLokasi').value || 'Gudang Utama';

            if (!kode || !nama) {
                showToast('Mohon lengkapi kode dan nama barang!', 'error');
                return;

            const newId = `BRG-${String(masterBarang.length + 1).padStart(3, '0')}`;

        function carryOverPeriod() {
            const nextP = getNextPeriod(activePeriod);
            if (confirm(`Apakah Anda yakin ingin menutup periode ${getMonthName(activePeriod)}?\n\nSaldo Akhir Fisik bulan ini akan otomatis menjadi Saldo Awal bulan ${getMonthName(nextP)}.`)) {
                
                // Initialize next period ledger with carry over
                if (!periodLedger[nextP]) periodLedger[nextP] = {};
                
                masterBarang.forEach(b => {
                    const currentStat = getItemPeriodStat(b.id, activePeriod);
                    periodLedger[nextP][b.id] = {
                        awal: currentStat.fisik,
                        masuk: 0,
                        keluar: 0,
                        fisik: currentStat.fisik,
                        condition: 'Baik',
                        note: `Carry over dari ${activePeriod}`
                    };
                });

                // Switch dropdown to next period
                activePeriod = nextP;
                document.getElementById('globalPeriodSelect').value = nextP;
                showToast(`Periode ${getMonthName(nextP)} berhasil dibuat dengan saldo carry-over!`, 'success');
                switchTab('persediaan');
            }
        }

        function autoFillHargaIn(barangId) {
            const b = masterBarang.find(x => x.id === barangId);

                calcTotalIn();
            }
        }

        function calcTotalIn() {
            const qty = parseFloat(document.getElementById('inJumlah').value) || 0;
            const harga = parseFloat(document.getElementById('inHarga').value) || 0;
            document.getElementById('inTotalDisplay').value = formatRp(qty * harga);
        }

        function saveBarangMasuk() {
            const tanggal = document.getElementById('inTgl').value;
            const noBukti = document.getElementById('inBukti').value;
            const barangId = document.getElementById('inBarangId').value;
            const jumlah = parseInt(document.getElementById('inJumlah').value) || 0;
            const harga = parseFloat(document.getElementById('inHarga').value) || 0;
            const vendor = document.getElementById('inVendor').value || 'Penyedia ATK';
            const ket = document.getElementById('inKet').value || '-';

            if (jumlah <= 0) {
                showToast('Jumlah barang masuk harus lebih besar dari 0!', 'error');
                return;
            }

            // Record transaction
            transactionsIn.unshift({
                id: `TR-IN-${Date.now().toString().slice(-5)}`,
                period: activePeriod,
                tanggal,
                noBukti,
                barangId,
                jumlah,
                harga,
                total: jumlah * harga,
                vendor,
                ket
            });

            // Update Period Ledger (ADD TO STOK)
            const stat = getItemPeriodStat(barangId, activePeriod);
            stat.masuk += jumlah;
            stat.fisik = stat.awal + stat.masuk - stat.keluar; // Sync physical automatically

            closeModal();
            showToast('Transaksi Barang Masuk berhasil dicatat & Stok bertambah!', 'success');
            renderBarangMasukView(document.getElementById('viewContainer'));
        }

        function saveBarangKeluar() {
            const tanggal = document.getElementById('outTgl').value;
            const barangId = document.getElementById('outBarangId').value;
            const jumlah = parseInt(document.getElementById('outJumlah').value) || 0;
            const unit = document.getElementById('outUnit').value || 'Umum';
            const penerima = document.getElementById('outPenerima').value || 'Staf';
            const keperluan = document.getElementById('outKeperluan').value || 'Operasional';

            const stat = getItemPeriodStat(barangId, activePeriod);
            if (jumlah > stat.fisik) {
                showToast(`Stok tidak mencukupi! Stok saat ini hanya ${stat.fisik}`, 'error');
                return;
            }

            // Deduct stock
            stat.keluar += jumlah;
            stat.fisik = Math.max(0, stat.awal + stat.masuk - stat.keluar);

            transactionsOut.unshift({
                id: `TR-OUT-${Date.now().toString().slice(-5)}`,
                period: activePeriod,
                tanggal,
                barangId,
                jumlah,
                unit,
                penerima,
                keperluan
            });

            closeModal();
            showToast('Pemakaian manual berhasil disimpan & stok terpotong!', 'success');
            renderBarangKeluarView(document.getElementById('viewContainer'));
        }

        // ==========================================
        // NOTIFICATIONS & MODALS UTILITIES
        // ==========================================

        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            dropdown.classList.toggle('hidden');
        }

        function updateNotifications() {
            const badge = document.getElementById('notifBadge');
            const list = document.getElementById('notifList');
            const unreadCount = notifications.filter(n => !n.read).length;

            if (unreadCount > 0) {
                badge.classList.remove('hidden');
                badge.innerText = unreadCount;
            } else {
                badge.classList.add('hidden');
            }

            if (notifications.length === 0) {
                list.innerHTML = `<p class="p-4 text-center text-slate-400 text-xs">Tidak ada notifikasi baru.</p>`;
            } else {
                list.innerHTML = notifications.map(n => `
                    <div class="p-3 hover:bg-slate-50 transition-colors ${!n.read ? 'bg-blue-50/40' : ''}">
                        <div class="font-bold text-slate-800">${n.title}</div>
                        <div class="text-slate-600 text-[11px] mt-0.5">${n.text}</div>
                        <div class="text-[10px] text-slate-400 mt-1">${n.time}</div>
                    </div>
                `).join('');
            }
        }

        function clearNotifs() {
            notifications.forEach(n => n.read = true);
            updateNotifications();
            showToast('Semua notifikasi dibaca', 'info');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : (type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white');
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');

            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl ${bgClass} text-xs font-semibold flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i> <span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function showModal(contentHtml) {
            const container = document.getElementById('modalContainer');
            container.innerHTML = contentHtml;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('modalContainer');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

    </script>
